name: Test

on:
  push:
    paths-ignore:
      - '**/README.md'
      - '.*'
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  codestyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - name: Check code style
        run: uv run --locked --only-group dev pycodestyle --ignore=E501 rttt

      - name: Check for unused imports and undefined names
        run: uv run --locked --only-group dev pyflakes rttt

  test_build:
    needs: codestyle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: "Install uv with Python ${{ matrix.python-version }}"
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --locked pytest

      - name: Test run
        run: uv run --locked rttt --version

      - name: Package project
        run: uv build --no-sources

  coinstall:
    # rttt has to stay installable alongside the Zephyr toolchain, which pins
    # pylink-square <2.0 via pyocd. Requiring ^2.0.1 made the two unresolvable:
    # `west packages pip --install` gave up, and pip on its own backtracked
    # through ancient releases looking for a way out.
    #
    # Plain pip rather than uv on purpose: it is what developers and
    # `west packages pip --install` actually run, so it is what has to pass.
    #
    # Resolved from an empty environment on purpose. Installing into an image
    # that already has the packages hides the conflict, because pip leaves what
    # is there alone.
    needs: codestyle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve against the Zephyr pylink pin
        run: pip install --dry-run . "pyocd==0.42.0"

      - name: Install alongside it for real, and check the result holds
        run: |
          pip install . "pyocd==0.42.0"
          pip check
          rttt --version
