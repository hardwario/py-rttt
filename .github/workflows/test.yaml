name: Test

on:
  push:
    paths-ignore:
      - '**/README.md'
      - '.*'
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  codestyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install code style checkers
        run: pip install pycodestyle pyflakes

      - name: Check code style
        run: pycodestyle --ignore=E501 rttt

      - name: Check for unused imports and undefined names
        run: pyflakes rttt

  test_build:
    needs: codestyle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | sed 's/symlinks=False/symlinks=True/' | python3 -

      - name: Update PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update Poetry configuration
        run: poetry config virtualenvs.create false

      - name: Check that poetry.lock matches pyproject.toml
        run: poetry check --lock

      - name: Install dependencies
        run: poetry sync --no-interaction

      - name: Run tests
        run: poetry run pytest

      - name: Test run
        run: poetry run rttt --version

      - name: Package project
        run: poetry build
